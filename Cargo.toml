[package]
name = "notify-relay-core"
# 版本号参与全链路协议兼容校验（仅比较 major.minor）与 DATA 通道 AES-GCM AAD 绑定：
# 跨 major.minor 的 core 之间即便公钥正确也无法解密，从而阻断跨版本通信。
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"
p256 = { version = "0.13", features = ["ecdh", "pem"] }
spake2 = { version = "0.5.0-pre.0", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
log = "0.4"
libc = "0.2"
socket2 = "0.5"
ruopus = "0.1"
rtp = "0.14"
bytes = "1"
webrtc-util = "0.12"
local-ip-address = "0.6"
strsim = "0.11"
parking_lot = "0.12"
threadpool = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
zeroize = "1"

[dev-dependencies]
env_logger = "0.11"
